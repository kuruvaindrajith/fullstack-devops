version: '3.8'

services:
  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend

  backend:
    build: ./backend
    ports:
      - "5000:5000"
    environment:
      - MYSQL_HOST=database
      - MYSQL_USER=root
      - MYSQL_PASSWORD=devops123
      - MYSQL_DB=devopsdb
    depends_on:
      - database

  database:
    image: mysql:8.0
    environment:
      - MYSQL_ROOT_PASSWORD=devops123
      - MYSQL_DATABASE=devopsdb
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:
